<nav class="hidden lg:flex flex-col justify-center fixed h-screen z-50">
  <ul class="w-max opacity-0 flex flex-col gap-1" id="nav-content">
    {{ range site.Menus.main }}
    <li>
      <a class="group flex items-center py-2.5" href="{{ .URL }}" data-section="{{ substr .URL 1 }}">
        <span
          class="nav-indicator mr-4 h-px w-8 bg-slate-600 transition-all group-hover:w-16 group-hover:bg-slate-200 group-focus-visible:w-16 group-focus-visible:bg-slate-200 motion-reduce:transition-none"
        ></span>
        <span
          class="nav-text text-xs font-bold uppercase text-slate-500 tracking-widest transition-colors group-hover:text-slate-200 group-focus-visible:text-slate-200"
        >
          {{ .Name }}
        </span>
      </a>
    </li>
    {{ end }}
  </ul>
</nav>

<div class="lg:hidden">
  <button
    id="mobile-menu-toggle"
    aria-label="Open menu"
    class="fixed top-4 left-4 z-50 p-2 rounded-lg bg-white/5 backdrop-blur-md border border-white/10 text-slate-200"
  >
    <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24">
      <path
        fill="currentColor"
        d="M2.753 18h18.5a.75.75 0 0 1 .101 1.493l-.101.007h-18.5a.75.75 0 0 1-.102-1.494L2.753 18h18.5h-18.5Zm0-6.497h18.5a.75.75 0 0 1 .101 1.493l-.101.007h-18.5a.75.75 0 0 1-.102-1.494l.102-.006h18.5h-18.5Zm-.001-6.5h18.5a.75.75 0 0 1 .102 1.493l-.102.007h-18.5A.75.75 0 0 1 2.65 5.01l.102-.007h18.5h-18.5Z"
      />
    </svg>
  </button>

  <div
    id="mobile-menu"
    class="fixed inset-0 z-[60] hidden opacity-0 flex flex-col items-center justify-center bg-deepblue/95 backdrop-blur-xl transition-opacity duration-300 ease-out"
  >
    <button
      id="mobile-menu-close"
      aria-label="Close menu"
      class="absolute top-5 right-5 p-2 rounded-lg border border-white/10 text-slate-200 hover:text-emerald-500 transition-colors"
    >
      <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24">
        <path
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          d="M18 6L6 18M6 6l12 12"
        />
      </svg>
    </button>

    <ul class="flex flex-col items-center gap-8">
      {{ range site.Menus.main }}
      <li>
        <a
          href="{{ .URL }}"
          data-section="{{ substr .URL 1 }}"
          class="mobile-link text-3xl font-bold uppercase tracking-widest text-slate-300 hover:text-emerald-500 transition-colors"
        >
          {{ .Name }}
        </a>
      </li>
      {{ end }}
    </ul>
  </div>
</div>
