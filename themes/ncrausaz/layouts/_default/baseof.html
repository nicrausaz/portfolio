<!doctype html>
<html lang="{{ .Site.LanguageCode }}" class="scroll-smooth">
  {{ partial "head.html" . }}

  <body
    class="overflow-x-hidden overflow-y-scroll bg-gradient-to-b from-deepblue to-deepbluegrad from-75%"
  >
    {{- partial "components/codeBackground.html" . -}} {{- partial
    "components/langSwitcher.html" . -}} {{- partial
    "components/customCursor.html" . -}} {{ if not hugo.IsProduction }} {{-
    partial "dev/dev-tools.html" . -}} {{ end }}
    <main class="relative z-10">{{- block "main" . }}{{- end }}</main>
  </body>
</html>
